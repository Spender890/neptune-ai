; ==============================================================================
; NEPTUNE-AI: Asterisk PJSIP Configuration (Endpoints & Transports)
; ==============================================================================

; --- UDP Transport (Listening on 0.0.0.0:5060) ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=127.0.0.1/32
external_media_address=192.168.1.16
external_signaling_address=192.168.1.16

; --- Common Endpoint Template ---
[endpoint-basic](!)
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_keepalive=5

; --- Extension 1001: Mobile Phone (Linphone / Zoiper) ---
[1001](endpoint-basic)
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=CHANGE_ME_STRONG_SIP_SECRET_1001

[1001]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=15

; --- Extension 1002: Tablet / Deskphone ---
[1002](endpoint-basic)
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
username=1002
password=CHANGE_ME_STRONG_SIP_SECRET_1002

[1002]
type=aor
max_contacts=2
remove_existing=yes

; --- Extension 7000: Neptune-AI Operator Bridge ---
[7000](endpoint-basic)
auth=auth7000
aors=7000

[auth7000]
type=auth
auth_type=userpass
username=7000
password=CHANGE_ME_STRONG_SIP_SECRET_7000

[7000]
type=aor
max_contacts=1
remove_existing=yes
