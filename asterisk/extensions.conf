; ==============================================================================
; NEPTUNE-AI: Asterisk Dialplan Routing
; ==============================================================================
[general]
static=yes
writeprotect=no
clearglobalvars=no

[internal]
; --- Room-to-Room Calling ---
; Dial 1001: Mobile Phone (Primary)
exten => 1001,1,NoOp(Calling Mobile Extension 1001: Primary)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

; Dial 1002: Tablet / Deskphone (Desk)
exten => 1002,1,NoOp(Calling Deskphone Extension 1002: Desk)
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

; --- Neptune AI Assistant Operator Bridge ---
exten => 7000,1,NoOp(Call to Neptune AI Operator from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)

 ; 1. Outbound Proactive Call Message Flow ("Call someone and tell them a message")
 same => n,GotoIf($["${OUTBOUND_MSG}" != ""]?outbound_msg_flow:check_reminder)

 ; 2. Outbound Reminder Flow
 same => n(check_reminder),GotoIf($["${REMINDER_MSG}" != ""]?reminder_flow:assistant_flow)

 ; --- Outbound Message Flow ---
 same => n(outbound_msg_flow),NoOp(Outbound Message Call: ${OUTBOUND_MSG})
 same => n,AGI(asterisk-voice-agent.py)
 same => n,Hangup()

 ; --- Outbound Reminder Flow ---
 same => n(reminder_flow),NoOp(Outbound Reminder Call: ${REMINDER_MSG})
 same => n,AGI(asterisk-voice-agent.py)
 same => n,Hangup()

 ; --- Assistant Flow (Interactive Conversation with Caller Recognition) ---
 same => n(assistant_flow),NoOp(Starting Assistant Flow for Caller ${CALLERID(num)})
 ; Play personalized greeting to caller
 same => n,AGI(asterisk-voice-agent.py,greet)
 ; Loop label for multi-turn conversation
 same => n(conversation_loop),NoOp(Recording caller turn...)
 ; Record up to 7 seconds, stop on 2 seconds of silence (s=2), beep before record (b), keep file (k)
 same => n,Record(/var/spool/asterisk/tmp/user_turn:wav,2,7,k)
 ; Call Python script to transcribe, query Neptune backend, and synthesize reply
 same => n,AGI(asterisk-voice-agent.py)
 ; If python set HANGUP_NOW=1, hangup, otherwise loop back for next turn
 same => n,GotoIf($["${HANGUP_NOW}" == "1"]?done:conversation_loop)
 same => n(done),Hangup()
